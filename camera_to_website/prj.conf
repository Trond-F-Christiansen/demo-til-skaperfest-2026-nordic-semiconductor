# Common configurations for all boards

# General
CONFIG_HW_ID_LIBRARY=y
CONFIG_ASSERT=y

# Logging
CONFIG_LOG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_NATIVE=y
CONFIG_NET_CONNECTION_MANAGER=y

# ZBus
CONFIG_ZBUS=y

# Zephyr state framework
CONFIG_SMF=y

# MQTT
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_CLEAN_SESSION=y

# Console
CONFIG_SERIAL=y

# Arducam Mega on the DK's Arduino SPI header (spi3)
CONFIG_SPI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4

CONFIG_CAMERA_TO_WEBSITE_TRANSPORT_BROKER_HOSTNAME="broker.hivemq.com"

# Capture resolution. Must be an exact width/height pair the Arducam supports --
# 96x96, 128x128, 320x240, 320x320, 640x480 and up -- or video_set_format() fails
# with -ENOTSUP. 320x320 measures roughly 9-13 KB per JPEG.
CONFIG_CAMERA_TO_WEBSITE_CAMERA_WIDTH=320
CONFIG_CAMERA_TO_WEBSITE_CAMERA_HEIGHT=320

# Caps the size of a single captured JPEG. At 320x320 a capture lands around
# 9-13 KB, so this still has headroom; raise it together with the camera
# resolution, and remember it is also the size of the PAYLOAD_CHAN message and of
# the camera module's capture buffer.
CONFIG_CAMERA_TO_WEBSITE_PAYLOAD_CHANNEL_STRING_MAX_SIZE=16384

CONFIG_CAMERA_TO_WEBSITE_TRANSPORT_THREAD_STACK_SIZE=24576
