# Logging and console
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_ASSERT=y
CONFIG_LOG_DEFAULT_LEVEL=3

#new: interrupt driven uart for uart_game
CONFIG_UART_INTERRUPT_DRIVEN=y

# GPIO for the temporary sw0 test-score button.
CONFIG_GPIO=y

# Keep printk off the deferred-log path so the forwarded "Command: X" line is
# emitted synchronously (matches the game_controller convention for its
# serial game-controller protocol).
CONFIG_LOG_PRINTK=n

# Bluetooth: central role, connects to the game_controller peripheral and
# subscribes to its Nordic UART Service (NUS) notifications.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="Game Receiver"

# One peripheral is held: "Game Controller". The peer table in
# src/ble/ble_central.c BUILD_ASSERTs against this, so raising the number of
# peers there without raising this fails the build rather than silently
# refusing the link.
CONFIG_BT_MAX_CONN=1

CONFIG_BT_GATT_DM=y
CONFIG_BT_NUS_CLIENT=y

# Peripherals are matched by advertised name rather than by a hardcoded address,
# so a board can be swapped without reflashing this one. One filter slot per
# expected peer.
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_NAME_CNT=1
