# Common configurations for all boards

# General
CONFIG_HW_ID_LIBRARY=y
CONFIG_ASSERT=y

# Logging
CONFIG_LOG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_NATIVE=y
CONFIG_NET_CONNECTION_MANAGER=y

# ZBus
CONFIG_ZBUS=y

# Zephyr state framework
CONFIG_SMF=y

# HTTPS upload
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MODEM_KEY_MGMT=y

# UART link to the nRF54LM20 hub firmware
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MQTT_SAMPLE_TRANSPORT_HOSTNAME="lrcs-student-project-website.fly.dev"
CONFIG_MQTT_SAMPLE_TRANSPORT_SEC_TAG=955

# A highscore message is a short JSON string, not a photo, so the payload
# buffer can be small.
CONFIG_MQTT_SAMPLE_PAYLOAD_CHANNEL_STRING_MAX_SIZE=256
CONFIG_MQTT_SAMPLE_TRANSPORT_THREAD_STACK_SIZE=8192
