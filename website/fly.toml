app = "lrcs-student-project-website"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  WEBSITE_OUTPUT_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "website_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
